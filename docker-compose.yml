services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: siklab
      POSTGRES_USER: siklab
      POSTGRES_PASSWORD: siklab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.example
    environment:
      POSTGRES_HOST: db
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
